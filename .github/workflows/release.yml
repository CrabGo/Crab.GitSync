name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
      - name: Test and build Windows release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG.StartsWith('v')) {
            ./build/release.ps1 -Version $env:RELEASE_TAG.Substring(1)
          } else {
            ./build/release.ps1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            bin/release/crab-gitsync-windows-amd64.exe
            bin/release/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: windows-amd64
          path: release
      - name: Publish executable and checksum together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="releases/$RELEASE_TAG.md"
          test -s "$notes"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Crab.GitSync $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release/crab-gitsync-windows-amd64.exe release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$notes" --draft=false --latest
